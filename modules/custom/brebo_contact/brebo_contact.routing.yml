brebo_contact.message:
  path: '/contact/bericht'
  defaults:
    _form: '\Drupal\brebo_contact\Form\ContactMessageForm'
    _title: 'Stuur een bericht'
  requirements:
    _access: 'TRUE'

brebo_contact.confirmation:
  path: '/contact/bericht/bedankt'
  defaults:
    _form: '\Drupal\brebo_contact\Form\ContactMessageForm'
    _title: 'Bericht ontvangen'
  requirements:
    _access: 'TRUE'
