services:
  brebo_europakozijn.configuration_validator:
    class: Drupal\brebo_europakozijn\Validation\ConfigurationValidator

  brebo_europakozijn.product_rule_engine:
    class: Drupal\brebo_europakozijn\Product\ProductRuleEngine

  brebo_europakozijn.price_intelligence:
    class: Drupal\brebo_europakozijn\Pricing\PriceIntelligence

  brebo_europakozijn.wind_load_calculator:
    class: Drupal\brebo_europakozijn\Wind\WindLoadCalculator

  brebo_europakozijn.glass_candidate_selector:
    class: Drupal\brebo_europakozijn\Glass\GlassCandidateSelector

  brebo_europakozijn.glass_wind_table_source:
    class: Drupal\brebo_europakozijn\Glass\GlassWindTableSource

  brebo_europakozijn.glass_wind_table_dataset:
    class: Drupal\brebo_europakozijn\Glass\GlassWindTableDataset
    arguments:
      - '@brebo_europakozijn.glass_wind_table_source'

  brebo_europakozijn.room_ventilation_zone_builder:
    class: Drupal\brebo_europakozijn\Ventilation\RoomVentilationZoneBuilder

  brebo_europakozijn.ventilation_requirement_resolver:
    class: Drupal\brebo_europakozijn\Ventilation\VentilationRequirementResolver
