brebo_europakozijn.configurator:
  path: '/europakozijn/samenstellen'
  defaults:
    _controller: '\Drupal\brebo_europakozijn\Controller\EuropakozijnConfiguratorController::build'
    _title: 'Stel uw Europakozijn samen'
  requirements:
    _permission: 'access content'

brebo_europakozijn.projectstukken:
  path: '/europakozijn/projectstukken'
  defaults:
    _controller: '\Drupal\brebo_europakozijn\Controller\EuropakozijnProjectstukkenController::build'
    _title: 'Kozijnen vanaf tekening of projectstukken'
  requirements:
    _permission: 'access content'

brebo_europakozijn.project_result:
  path: '/europakozijn/projectstukken/resultaat/{intake_id}'
  defaults:
    _controller: '\Drupal\brebo_europakozijn\Controller\EuropakozijnProjectResultController::build'
    _title: 'Herkende projectinformatie'
  requirements:
    _permission: 'access content'
    intake_id: '[0-9a-fA-F-]{36}'
  methods: [GET]

brebo_europakozijn.validate:
  path: '/europakozijn/api/validate'
  defaults:
    _controller: '\Drupal\brebo_europakozijn\Controller\EuropakozijnValidationController::validate'
  requirements:
    _permission: 'access content'
  methods: [POST]

brebo_europakozijn.rule_validate:
  path: '/europakozijn/api/rules'
  defaults:
    _controller: '\Drupal\brebo_europakozijn\Controller\EuropakozijnRuleValidationController::validate'
  requirements:
    _permission: 'access content'
  methods: [POST]

brebo_europakozijn.wind_validate:
  path: '/europakozijn/api/wind'
  defaults:
    _controller: '\Drupal\brebo_europakozijn\Controller\EuropakozijnWindValidationController::validate'
  requirements:
    _permission: 'access content'
  methods: [POST]

brebo_europakozijn.glass_advice:
  path: '/europakozijn/api/glass-advice'
  defaults:
    _controller: '\Drupal\brebo_europakozijn\Controller\EuropakozijnGlassAdviceController::advise'
  requirements:
    _permission: 'access content'
  methods: [POST]

brebo_europakozijn.address_lookup:
  path: '/europakozijn/api/address'
  defaults:
    _controller: '\Drupal\brebo_europakozijn\Controller\EuropakozijnAddressLookupController::lookup'
  requirements:
    _permission: 'access content'
  methods: [GET]

brebo_europakozijn.project_upload:
  path: '/europakozijn/api/project-upload'
  defaults:
    _controller: '\Drupal\brebo_europakozijn\Controller\EuropakozijnProjectUploadController::upload'
  requirements:
    _permission: 'access content'
  methods: [POST]

brebo_europakozijn.office_handoff:
  path: '/europakozijn/api/request'
  defaults:
    _controller: '\Drupal\brebo_europakozijn\Controller\EuropakozijnOfficeHandoffController::submit'
  requirements:
    _permission: 'access content'
  methods: [POST]
