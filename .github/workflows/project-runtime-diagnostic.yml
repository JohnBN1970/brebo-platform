name: BREBO Project runtime diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - 'modules/custom/brebo_projects/**'
      - 'modules/custom/brebo_projects_demo/**'
      - '.github/workflows/project-runtime-diagnostic.yml'

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect live project runtime
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_HOST: 77.37.34.160
      DEPLOY_PORT: '65002'
      DEPLOY_USER: u213420663

    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          : > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          for attempt in 1 2 3 4 5; do
            if timeout 20 ssh \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              -o ServerAliveInterval=5 \
              -o ServerAliveCountMax=2 \
              -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -i ~/.ssh/deploy_key \
              -p "$DEPLOY_PORT" \
              "$DEPLOY_USER@$DEPLOY_HOST" 'true'; then
              break
            fi

            if [[ "$attempt" -eq 5 ]]; then
              echo "::error::Unable to establish authenticated SSH connection."
              exit 1
            fi
            sleep $((attempt * 2))
          done

      - name: Inspect Drupal project state
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=3 \
            -i ~/.ssh/deploy_key \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          target="$HOME/domains/brebobv.nl/public_html/platform"
          cd "$target"

          if [[ -x /opt/alt/php83/usr/bin/php ]]; then
            php_bin=/opt/alt/php83/usr/bin/php
          else
            php_bin="$(command -v php)"
          fi
          drush=("$php_bin" -d memory_limit=512M vendor/drush/drush/drush.php --no-ansi)

          echo "===== PROJECT RUNTIME ====="
          "${drush[@]}" php:eval '
          $modules = \Drupal::moduleHandler();
          print "BREBO_PROJECTS_ENABLED=" . ($modules->moduleExists("brebo_projects") ? "JA" : "NEE") . "\n";
          print "BREBO_PROJECTS_DEMO_ENABLED=" . ($modules->moduleExists("brebo_projects_demo") ? "JA" : "NEE") . "\n";

          $types = \Drupal::entityTypeManager()->getStorage("node_type");
          print "PROJECT_CONTENT_TYPE=" . ($types->load("project") ? "AANWEZIG" : "ONTBREEKT") . "\n";

          if ($types->load("project")) {
            $storage = \Drupal::entityTypeManager()->getStorage("node");
            $total = $storage->getQuery()->accessCheck(FALSE)->condition("type", "project")->count()->execute();
            $published = $storage->getQuery()->accessCheck(FALSE)->condition("type", "project")->condition("status", 1)->count()->execute();
            print "PROJECT_NODES_TOTAL=" . $total . "\n";
            print "PROJECT_NODES_PUBLISHED=" . $published . "\n";

            $defs = \Drupal::service("entity_field.manager")->getFieldDefinitions("node", "project");
            $featuredField = isset($defs["field_featured"]);
            print "FIELD_FEATURED=" . ($featuredField ? "AANWEZIG" : "ONTBREEKT") . "\n";
            if ($featuredField) {
              $featured = $storage->getQuery()->accessCheck(FALSE)->condition("type", "project")->condition("status", 1)->condition("field_featured", 1)->count()->execute();
              print "PROJECT_NODES_FEATURED_PUBLISHED=" . $featured . "\n";
            }
          }

          $view = \Drupal\views\Entity\View::load("brebo_featured_projects");
          print "FEATURED_VIEW=" . ($view ? "AANWEZIG" : "ONTBREEKT") . "\n";
          if ($view) {
            print "FEATURED_VIEW_STATUS=" . ($view->status() ? "AAN" : "UIT") . "\n";
            $displays = $view->get("display") ?: [];
            print "FEATURED_VIEW_BLOCK_1=" . (isset($displays["block_1"]) ? "AANWEZIG" : "ONTBREEKT") . "\n";
          }

          $blocks = \Drupal::entityTypeManager()->getStorage("block")->loadByProperties(["plugin" => "brebo_featured_projects"]);
          print "FEATURED_BLOCK_PLACEMENTS=" . count($blocks) . "\n";
          foreach ($blocks as $id => $block) {
            print "FEATURED_BLOCK_" . $id . "_STATUS=" . ($block->status() ? "AAN" : "UIT") . "\n";
            print "FEATURED_BLOCK_" . $id . "_REGION=" . $block->getRegion() . "\n";
          }
          '

          echo "===== PUBLIC ROUTES ====="
          for path in / /projecten; do
            code="$(curl -L -sS -o /dev/null --max-time 20 -w '%{http_code}' "https://platform.brebobv.nl${path}")"
            echo "HTTP_${path//\//_}=$code"
          done
          REMOTE
