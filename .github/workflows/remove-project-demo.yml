name: Remove BREBO project demo

on:
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/remove-project-demo.yml'

permissions:
  contents: read

jobs:
  cleanup:
    name: Remove verified project demo content
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_HOST: 77.37.34.160
      DEPLOY_PORT: '65002'
      DEPLOY_USER: u213420663

    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          : > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" true

      - name: Wait for completed deploy
        shell: bash
        run: |
          set -euo pipefail
          expected_sha="$GITHUB_SHA"
          marker='$HOME/domains/brebobv.nl/public_html/platform/.brebo-deploy-ok-sha'
          for attempt in $(seq 1 45); do
            deployed_sha="$(ssh -o ConnectTimeout=15 -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "if [[ -f $marker ]]; then cat $marker; fi")"
            echo "ATTEMPT=$attempt MARKER_SHA=${deployed_sha:-ONTBREEKT} EXPECTED_SHA=$expected_sha"
            if [[ "$deployed_sha" == "$expected_sha" ]]; then exit 0; fi
            sleep 10
          done
          echo "::error::Completed deployment marker did not reach triggering commit."
          exit 1

      - name: Verify exact demo-only precondition and uninstall
        shell: bash
        run: |
          set -euo pipefail
          ssh -o ConnectTimeout=15 -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          target="$HOME/domains/brebobv.nl/public_html/platform"
          cd "$target"
          if [[ -x /opt/alt/php83/usr/bin/php ]]; then php_bin=/opt/alt/php83/usr/bin/php; else php_bin="$(command -v php)"; fi
          drush=("$php_bin" -d memory_limit=512M vendor/drush/drush/drush.php --no-ansi)

          "${drush[@]}" php:eval '
          if (!\Drupal::moduleHandler()->moduleExists("brebo_projects_demo")) {
            throw new \RuntimeException("brebo_projects_demo is niet actief; cleanup wordt niet uitgevoerd.");
          }

          $storage = \Drupal::entityTypeManager()->getStorage("node");
          $ids = $storage->getQuery()->accessCheck(FALSE)->condition("type", "project")->sort("nid")->execute();
          if (count($ids) !== 3) {
            throw new \RuntimeException("Precondition mislukt: verwacht exact 3 projectnodes, gevonden " . count($ids) . ".");
          }

          $expected = [
            "Gevelherstel appartementencomplex" => [
              "question" => "Voorkomen van doorslaand vocht bij een appartementencomplex.",
              "approach" => "De oorzaken zijn eerst zorgvuldig in kaart gebracht. Daarna zijn herstelwerk, planning en communicatie samengebracht in één overzichtelijke aanpak.",
              "results" => [
                "Schade hersteld en verdere achteruitgang gestopt.",
                "Onderhoud voorspelbaar en beheersbaar.",
                "Bewoners konden in het gebouw blijven.",
              ],
              "sort_order" => "1",
              "image_uri" => "public://brebo-projecten-demo/project-1.webp",
              "image_alt" => "Modern appartementencomplex na gevelherstel",
            ],
            "Integrale aanpak voor een VvE-complex" => [
              "question" => "Verouderde gevel en een hoge onderhoudslast bij een VvE-complex.",
              "approach" => "Voor gevel, kozijnen, voegwerk en schilderwerk is één totaalplan opgesteld. Heldere communicatie met de VvE en bewoners stond gedurende het hele traject centraal.",
              "results" => [
                "Gevel weer toekomstbestendig.",
                "Onderhoudskosten structureel verlaagd.",
                "Waarde en uitstraling van het complex verbeterd.",
              ],
              "sort_order" => "2",
              "image_uri" => "public://brebo-projecten-demo/project-2.webp",
              "image_alt" => "Appartementengebouw met vernieuwde gevel en kozijnen",
            ],
            "Verduurzaming kantoorgebouw" => [
              "question" => "Snelle verduurzaming en verbetering van het comfort in een kantoorgebouw.",
              "approach" => "De prestaties van de buitenzijde zijn geanalyseerd en vertaald naar maatregelen die direct effect hebben op comfort, energiegebruik en uitstraling.",
              "results" => [
                "Energiegebruik aantoonbaar verlaagd.",
                "Comfort voor gebruikers verbeterd.",
                "Modern en representatief aanzicht.",
              ],
              "sort_order" => "3",
              "image_uri" => "public://brebo-projecten-demo/project-3.webp",
              "image_alt" => "Modern kantoorgebouw na verduurzaming",
            ],
          ];

          foreach ($storage->loadMultiple($ids) as $node) {
            $title = (string) $node->label();
            if (!isset($expected[$title])) {
              throw new \RuntimeException("Precondition mislukt: onverwachte projectnode " . $title . ".");
            }
            $signature = $expected[$title];

            if (!$node->isPublished()) {
              throw new \RuntimeException("Precondition mislukt: project " . $title . " is niet meer gepubliceerd.");
            }
            foreach (["field_featured", "field_pillar_insight", "field_pillar_regie", "field_pillar_realisation"] as $field) {
              if ((string) $node->get($field)->value !== "1") {
                throw new \RuntimeException("Precondition mislukt: project " . $title . " wijkt af op " . $field . ".");
              }
            }
            if ((string) $node->get("field_client_question")->value !== $signature["question"]) {
              throw new \RuntimeException("Precondition mislukt: project " . $title . " wijkt af op klantvraag.");
            }
            if ((string) $node->get("field_brebo_approach")->value !== $signature["approach"]) {
              throw new \RuntimeException("Precondition mislukt: project " . $title . " wijkt af op aanpak.");
            }
            if ((string) $node->get("field_sort_order")->value !== $signature["sort_order"]) {
              throw new \RuntimeException("Precondition mislukt: project " . $title . " wijkt af op sortering.");
            }

            $actual_results = array_map(
              static fn(array $item): string => (string) ($item["value"] ?? ""),
              $node->get("field_project_results")->getValue()
            );
            if ($actual_results !== $signature["results"]) {
              throw new \RuntimeException("Precondition mislukt: project " . $title . " wijkt af op resultaten.");
            }

            $image_item = $node->get("field_project_image")->first();
            $image = $image_item?->entity;
            if (!$image || $image->getFileUri() !== $signature["image_uri"]) {
              throw new \RuntimeException("Precondition mislukt: project " . $title . " heeft niet het verwachte demo-afbeeldingspad.");
            }
            if ((string) ($image_item->alt ?? "") !== $signature["image_alt"]) {
              throw new \RuntimeException("Precondition mislukt: project " . $title . " wijkt af op image-alt.");
            }

            unset($expected[$title]);
          }

          if ($expected !== []) {
            throw new \RuntimeException("Precondition mislukt: niet alle drie canonieke demo-projecten zijn exact aangetroffen.");
          }

          print "PRECONDITION=GOED\n";
          '

          "${drush[@]}" pm:uninstall brebo_projects_demo -y
          "${drush[@]}" cr

          "${drush[@]}" php:eval '
          print "BREBO_PROJECTS_DEMO_ENABLED=" . (\Drupal::moduleHandler()->moduleExists("brebo_projects_demo") ? "JA" : "NEE") . "\n";
          $storage = \Drupal::entityTypeManager()->getStorage("node");
          $count = $storage->getQuery()->accessCheck(FALSE)->condition("type", "project")->count()->execute();
          print "PROJECT_NODES_TOTAL=" . $count . "\n";
          if (\Drupal::moduleHandler()->moduleExists("brebo_projects_demo") || (int) $count !== 0) {
            throw new \RuntimeException("Postcondition mislukt na demo-uninstall.");
          }
          '

          for path in / /projecten; do
            code="$(curl -L -sS -o /dev/null --max-time 20 -w '%{http_code}' "https://platform.brebobv.nl${path}")"
            echo "HTTP_${path//\//_}=$code"
            if [[ "$code" != "200" ]]; then
              exit 1
            fi
          done
          REMOTE
