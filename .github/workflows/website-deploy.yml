name: BREBO Website deploy

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brebo-website-deploy-develop
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy platform.brebobv.nl
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_HOST: 77.37.34.160
      DEPLOY_PORT: '65002'
      DEPLOY_USER: u213420663

    steps:
      - name: Validate deployment settings
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_PORT DEPLOY_USER DEPLOY_SSH_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required deployment setting $name is missing."
              exit 1
            fi
          done

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          : > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          for attempt in 1 2 3 4 5; do
            if timeout 20 ssh \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              -o ServerAliveInterval=5 \
              -o ServerAliveCountMax=2 \
              -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -i ~/.ssh/deploy_key \
              -p "$DEPLOY_PORT" \
              "$DEPLOY_USER@$DEPLOY_HOST" 'true'; then
              break
            fi

            if [[ "$attempt" -eq 5 ]]; then
              echo "::error::Unable to establish authenticated SSH connection."
              exit 1
            fi

            sleep $((attempt * 2))
          done

      - name: Deploy develop publish assets and verify website
        shell: bash
        run: |
          set -euo pipefail

          ssh \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=3 \
            -i ~/.ssh/deploy_key \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE'
          set -eEuo pipefail
          export NO_COLOR=1 TERM=dumb

          target="$HOME/domains/brebobv.nl/public_html/platform"
          public_root="$target/web"
          branch="develop"
          public_url="https://platform.brebobv.nl/"

          [[ -d "$target/.git" ]] || {
            echo "::error::Target is not a Git repository: $target"
            exit 1
          }

          [[ -d "$public_root" && -f "$public_root/index.php" ]] || {
            echo "::error::Expected public webroot is missing: $public_root"
            exit 1
          }

          cd "$target"

          current_branch="$(git branch --show-current)"
          [[ "$current_branch" == "$branch" ]] || {
            echo "::error::Expected branch $branch, found $current_branch"
            exit 1
          }

          git fetch origin "$branch"
          git pull --ff-only origin "$branch"

          echo "===== PUBLISH PUBLIC CUSTOM EXTENSIONS ====="
          rm -rf "$public_root/modules/custom" "$public_root/themes/custom"
          mkdir -p "$public_root/modules" "$public_root/themes"
          cp -a "$target/modules/custom" "$public_root/modules/custom"
          cp -a "$target/themes/custom" "$public_root/themes/custom"

          [[ -f "$public_root/themes/custom/brebo_theme/logo.svg" ]] || {
            echo "::error::BREBO logo was not published to the public webroot."
            exit 1
          }

          echo "PUBLIC_MODULES=$(find "$public_root/modules/custom" -mindepth 1 -maxdepth 1 -type d | wc -l)"
          echo "PUBLIC_THEMES=$(find "$public_root/themes/custom" -mindepth 1 -maxdepth 1 -type d | wc -l)"

          if [[ -x /opt/alt/php83/usr/bin/php ]]; then
            php_bin=/opt/alt/php83/usr/bin/php
          else
            php_bin="$(command -v php)"
          fi

          [[ -n "$php_bin" && -x "$php_bin" ]] || {
            echo "::error::No usable PHP binary found."
            exit 1
          }

          [[ -f vendor/drush/drush/drush.php ]] || {
            echo "::error::Drush entry point is missing."
            exit 1
          }

          drush=("$php_bin" -d memory_limit=512M vendor/drush/drush/drush.php --no-ansi)

          echo "===== DRUPAL PRECHECK ====="
          "${drush[@]}" status --fields=bootstrap,root,uri --format=list

          echo "===== CACHE REBUILD ====="
          "${drush[@]}" cr

          echo "===== RUNTIME CHECK ====="
          "${drush[@]}" php:eval 'print "DRUPAL_BOOTSTRAP_OK=1\n"; print "SITE_NAME=" . \Drupal::config("system.site")->get("name") . "\n";'

          echo "===== FRONTEND ASSET CHECK ====="
          lens_css_rel="modules/custom/brebo_lens/css/brebo-lens.css"
          lens_js_rel="modules/custom/brebo_lens/js/brebo-lens.js"
          for asset in "$lens_css_rel" "$lens_js_rel"; do
            [[ -s "$public_root/$asset" ]] || {
              echo "::error::Published frontend asset is missing or empty: $asset"
              exit 1
            }
          done

          source_css_sha="$(sha256sum "$target/$lens_css_rel" | awk '{print $1}')"
          public_css_sha="$(sha256sum "$public_root/$lens_css_rel" | awk '{print $1}')"
          source_js_sha="$(sha256sum "$target/$lens_js_rel" | awk '{print $1}')"
          public_js_sha="$(sha256sum "$public_root/$lens_js_rel" | awk '{print $1}')"
          [[ "$source_css_sha" == "$public_css_sha" ]] || { echo "::error::Lens CSS differs between source and public webroot."; exit 1; }
          [[ "$source_js_sha" == "$public_js_sha" ]] || { echo "::error::Lens JS differs between source and public webroot."; exit 1; }

          asset_token="$(git rev-parse --short=12 HEAD)"
          lens_css_url="${public_url}${lens_css_rel}?v=${asset_token}"
          lens_js_url="${public_url}${lens_js_rel}?v=${asset_token}"
          lens_css_result="$(curl -L -sS -o /tmp/brebo-lens.css --max-time 20 -w '%{http_code} %{content_type}' "$lens_css_url")"
          lens_js_result="$(curl -L -sS -o /tmp/brebo-lens.js --max-time 20 -w '%{http_code} %{content_type}' "$lens_js_url")"
          public_http_css_sha="$(sha256sum /tmp/brebo-lens.css | awk '{print $1}')"
          public_http_js_sha="$(sha256sum /tmp/brebo-lens.js | awk '{print $1}')"
          [[ "$public_http_css_sha" == "$source_css_sha" ]] || { echo "::error::Public Lens CSS is stale or differs from deployed source."; exit 1; }
          [[ "$public_http_js_sha" == "$source_js_sha" ]] || { echo "::error::Public Lens JS is stale or differs from deployed source."; exit 1; }
          echo "LENS_CSS_RESULT=$lens_css_result"
          echo "LENS_JS_RESULT=$lens_js_result"
          echo "LENS_ASSETS_CURRENT=1"

          echo "===== PUBLIC SMOKE TESTS ====="
          homepage_code="$(curl -L -sS -o /dev/null --max-time 20 -w '%{http_code}' "${public_url}?v=${asset_token}")"
          logo_url="${public_url}themes/custom/brebo_theme/logo.svg?v=${asset_token}"
          logo_result="$(curl -L -sS -o /dev/null --max-time 20 -w '%{http_code} %{content_type}' "$logo_url")"

          echo "PUBLIC_URL=$public_url"
          echo "HOMEPAGE_HTTP_CODE=$homepage_code"
          echo "LOGO_URL=$logo_url"
          echo "LOGO_RESULT=$logo_result"

          case "$homepage_code" in
            200|301|302) ;;
            *)
              echo "::error::Unexpected HTTP status from $public_url: $homepage_code"
              exit 1
              ;;
          esac

          case "$logo_result" in
            200\ image/svg+xml*) ;;
            *)
              echo "::error::BREBO logo is not publicly available as SVG: $logo_result"
              exit 1
              ;;
          esac

          deployed_sha="$(git rev-parse HEAD)"
          echo "DEPLOY_OK=1"
          echo "PUBLIC_ASSETS_OK=1"
          echo "DEPLOYED_SHA=$deployed_sha"
          echo "TARGET=$target"
          echo "PUBLIC_ROOT=$public_root"
          REMOTE
