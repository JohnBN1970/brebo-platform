name: BREBO Website deploy

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brebo-website-deploy-develop
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy brebobv.nl
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_HOST: 77.37.34.160
      DEPLOY_PORT: '65002'
      DEPLOY_USER: u213420663

    steps:
      - name: Validate deployment settings
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_PORT DEPLOY_USER DEPLOY_SSH_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required deployment setting $name is missing."
              exit 1
            fi
          done

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          : > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          for attempt in 1 2 3 4 5; do
            if timeout 20 ssh \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              -o ServerAliveInterval=5 \
              -o ServerAliveCountMax=2 \
              -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -i ~/.ssh/deploy_key \
              -p "$DEPLOY_PORT" \
              "$DEPLOY_USER@$DEPLOY_HOST" 'true'; then
              break
            fi

            if [[ "$attempt" -eq 5 ]]; then
              echo "::error::Unable to establish authenticated SSH connection."
              exit 1
            fi
            sleep $((attempt * 2))
          done

      - name: Deploy canonical Drupal app and verify public root
        shell: bash
        run: |
          set -euo pipefail

          ssh \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=3 \
            -i ~/.ssh/deploy_key \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE'
          set -eEuo pipefail
          export NO_COLOR=1 TERM=dumb

          root="$HOME/domains/brebobv.nl/public_html"
          target="$root/platform"
          branch="develop"
          public_url="https://brebobv.nl/"
          deploy_marker="$target/.brebo-deploy-ok-sha"

          [[ -d "$target/.git" ]] || {
            echo "::error::Target is not a Git repository: $target"
            exit 1
          }

          [[ -f "$root/index.php" ]] || {
            echo "::error::Normalized public front controller is missing: $root/index.php"
            exit 1
          }

          for link in core modules profiles sites themes; do
            [[ -L "$root/$link" && "$(readlink "$root/$link")" == "platform/$link" ]] || {
              echo "::error::Normalized public link is missing or wrong: $root/$link"
              exit 1
            }
          done

          cd "$target"
          rm -f "$deploy_marker"

          current_branch="$(git branch --show-current)"
          [[ "$current_branch" == "$branch" ]] || {
            echo "::error::Expected branch $branch, found $current_branch"
            exit 1
          }

          git fetch origin "$branch"
          git pull --ff-only origin "$branch"

          if [[ -x /opt/alt/php83/usr/bin/php ]]; then
            php_bin=/opt/alt/php83/usr/bin/php
          else
            php_bin="$(command -v php)"
          fi

          [[ -n "$php_bin" && -x "$php_bin" ]] || {
            echo "::error::No usable PHP binary found."
            exit 1
          }

          [[ -f vendor/drush/drush/drush.php ]] || {
            echo "::error::Drush entry point is missing."
            exit 1
          }

          drush=("$php_bin" -d memory_limit=512M vendor/drush/drush/drush.php --no-ansi)

          echo "===== DRUPAL PRECHECK ====="
          "${drush[@]}" status --fields=bootstrap,root,uri --format=list

          echo "===== REQUIRED WEBSITE MODULES ====="
          "${drush[@]}" en -y brebo_europakozijn
          europakozijn_status="$("${drush[@]}" pml --type=module --status=enabled --format=list | grep -Fx 'brebo_europakozijn' || true)"
          [[ "$europakozijn_status" == "brebo_europakozijn" ]] || {
            echo "::error::brebo_europakozijn is not enabled after deployment."
            exit 1
          }
          echo "EUROPAKOZIJN_MODULE_ENABLED=1"

          echo "===== PROJECTS ROUTE GUARD ====="
          "${drush[@]}" php:eval '
            $aliasStorage = \Drupal::entityTypeManager()->getStorage("path_alias");
            $aliasIds = $aliasStorage->getQuery()
              ->accessCheck(FALSE)
              ->condition("alias", "/projecten")
              ->execute();
            print "PROJECTS_ALIAS_CONFLICTS=" . count($aliasIds) . "\n";
            if ($aliasIds !== []) {
              $aliasStorage->delete($aliasStorage->loadMultiple($aliasIds));
              print "PROJECTS_ALIAS_CONFLICTS_REMOVED=" . count($aliasIds) . "\n";
            }

            $menuStorage = \Drupal::entityTypeManager()->getStorage("menu_link_content");
            $menuIds = $menuStorage->getQuery()
              ->accessCheck(FALSE)
              ->condition("menu_name", "main")
              ->condition("title", "Projecten")
              ->execute();
            print "PROJECTS_MENU_LINKS=" . count($menuIds) . "\n";
            foreach ($menuStorage->loadMultiple($menuIds) as $link) {
              if ($link->get("link")->uri !== "internal:/projecten") {
                $link->set("link", ["uri" => "internal:/projecten"]);
                $link->save();
                print "PROJECTS_MENU_LINK_REPAIRED=1\n";
              }
            }
          '

          echo "===== CACHE REBUILD ====="
          "${drush[@]}" cr

          echo "===== KNOWLEDGE SEED IMPORT ====="
          "${drush[@]}" php:eval '
            $importer = \Drupal::service("brebo_customer_service.knowledge_item_seed_importer");
            $result = $importer->import();
            $storage = \Drupal::entityTypeManager()->getStorage("node");
            $persisted = $storage->getQuery()
              ->accessCheck(FALSE)
              ->condition("type", "brebo_knowledge_item")
              ->condition("field_knowledge_basis", "BREBO-WEB-SEED:", "CONTAINS")
              ->count()
              ->execute();
            $reportedTotal = count($result["created"]) + count($result["existing"]);
            print "KNOWLEDGE_SEED_CREATED=" . count($result["created"]) . "\n";
            print "KNOWLEDGE_SEED_EXISTING=" . count($result["existing"]) . "\n";
            print "KNOWLEDGE_SEED_ERRORS=" . count($result["errors"]) . "\n";
            print "KNOWLEDGE_SEED_REPORTED_TOTAL=" . $reportedTotal . "\n";
            print "KNOWLEDGE_SEED_TOTAL=" . $persisted . "\n";
            if ($result["errors"] !== []) {
              throw new \RuntimeException("Knowledge seed import contains errors.");
            }
            if ((int) $persisted !== 48 || $reportedTotal !== 48) {
              throw new \RuntimeException("Expected exactly 48 canonical Knowledgebase seeds.");
            }
          '

          echo "===== SOURCE ASSET CHECK ====="
          for asset in \
            modules/custom/brebo_lens/css/brebo-lens.css \
            modules/custom/brebo_lens/js/brebo-lens.js \
            modules/custom/brebo_projects/templates/brebo-projects-overview.html.twig \
            modules/custom/brebo_europakozijn/brebo_europakozijn.routing.yml \
            themes/custom/brebo_theme/logo.svg; do
            [[ -s "$target/$asset" ]] || {
              echo "::error::Required source asset is missing or empty: $asset"
              exit 1
            }
          done

          asset_token="$(git rev-parse --short=12 HEAD)"

          echo "===== PUBLIC ASSET CHECK ====="
          lens_css_rel="modules/custom/brebo_lens/css/brebo-lens.css"
          lens_js_rel="modules/custom/brebo_lens/js/brebo-lens.js"
          source_css_sha="$(sha256sum "$target/$lens_css_rel" | awk '{print $1}')"
          source_js_sha="$(sha256sum "$target/$lens_js_rel" | awk '{print $1}')"

          curl -L -sS -o /tmp/brebo-lens.css --max-time 20 "${public_url}${lens_css_rel}?v=${asset_token}"
          curl -L -sS -o /tmp/brebo-lens.js --max-time 20 "${public_url}${lens_js_rel}?v=${asset_token}"

          [[ "$(sha256sum /tmp/brebo-lens.css | awk '{print $1}')" == "$source_css_sha" ]] || {
            echo "::error::Public Lens CSS differs from canonical source."
            exit 1
          }
          [[ "$(sha256sum /tmp/brebo-lens.js | awk '{print $1}')" == "$source_js_sha" ]] || {
            echo "::error::Public Lens JS differs from canonical source."
            exit 1
          }
          echo "PUBLIC_ASSETS_CURRENT=1"

          echo "===== PUBLIC SMOKE TESTS ====="
          homepage_code="$(curl -L -sS -o /tmp/brebo-home.html --max-time 20 -w '%{http_code}' "${public_url}?v=${asset_token}")"
          logo_result="$(curl -L -sS -o /dev/null --max-time 20 -w '%{http_code} %{content_type}' "${public_url}themes/custom/brebo_theme/logo.svg?v=${asset_token}")"
          projects_code="$(curl -L -sS -o /tmp/brebo-projecten.html --max-time 20 -w '%{http_code}' "${public_url}projecten?v=${asset_token}")"
          europakozijn_code="$(curl -L -sS -o /tmp/brebo-europakozijn.html --max-time 20 -w '%{http_code}' "${public_url}europakozijn/samenstellen?v=${asset_token}")"
          user_code="$(curl -sS -o /dev/null -w '%{http_code}' "${public_url}user?v=${asset_token}")"
          login_code="$(curl -L -sS -o /dev/null -w '%{http_code}' "${public_url}user/login?v=${asset_token}")"

          echo "PUBLIC_URL=$public_url"
          echo "HOMEPAGE_HTTP_CODE=$homepage_code"
          echo "LOGO_RESULT=$logo_result"
          echo "PROJECTS_HTTP_CODE=$projects_code"
          echo "EUROPAKOZIJN_HTTP_CODE=$europakozijn_code"
          echo "USER_HTTP_CODE=$user_code"
          echo "USER_LOGIN_HTTP_CODE=$login_code"

          [[ "$homepage_code" == "200" ]] || { echo "::error::Homepage failed."; exit 1; }
          case "$logo_result" in
            200\ image/svg+xml*) ;;
            *) echo "::error::BREBO logo is not publicly available as SVG: $logo_result"; exit 1 ;;
          esac
          [[ "$projects_code" == "200" ]] || { echo "::error::Projects page failed."; exit 1; }
          [[ "$europakozijn_code" == "200" ]] || { echo "::error::Europakozijn configurator page failed."; exit 1; }
          [[ "$user_code" == "302" ]] || { echo "::error::Anonymous /user must redirect with HTTP 302."; exit 1; }
          [[ "$login_code" == "200" ]] || { echo "::error::User login page failed."; exit 1; }

          grep -Fq 'De situatie aan het gebouw bepaalt de aanpak.' /tmp/brebo-projecten.html || {
            echo "::error::Public projects page does not render the BREBO projects hero."
            exit 1
          }
          grep -Fq 'Hier wordt aan gewerkt. Letterlijk.' /tmp/brebo-projecten.html || {
            echo "::error::Public projects page does not render the expected empty-state."
            exit 1
          }
          grep -Fq 'data-europakozijn-configurator' /tmp/brebo-europakozijn.html || {
            echo "::error::Public Europakozijn page does not render the configurator."
            exit 1
          }
          if grep -Fq 'href="/node/5"' /tmp/brebo-home.html; then
            echo "::error::Production homepage still contains stale Projecten link to /node/5."
            exit 1
          fi
          if grep -Fq '/platform/web/' /tmp/brebo-home.html; then
            echo "::error::Production homepage exposes legacy /platform/web path."
            exit 1
          fi

          echo "PROJECTS_PUBLIC_RENDER_OK=1"
          echo "PROJECTS_MENU_ROUTE_OK=1"
          echo "EUROPAKOZIJN_PUBLIC_RENDER_OK=1"
          echo "PUBLIC_ROOT_NORMALIZED=1"

          deployed_sha="$(git rev-parse HEAD)"
          printf '%s\n' "$deployed_sha" > "$deploy_marker"
          echo "DEPLOY_OK=1"
          echo "DEPLOYED_SHA=$deployed_sha"
          echo "DEPLOY_MARKER=$deploy_marker"
          echo "TARGET=$target"
          echo "PUBLIC_ROOT=$root"
          REMOTE
