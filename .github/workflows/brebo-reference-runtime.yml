name: BREBO Reference runtime

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'modules/custom/brebo_reference/**'
      - '.github/workflows/brebo-reference-runtime.yml'
      - 'composer.json'
      - 'composer.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: PHP syntax and Drupal kernel test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, dom, sqlite3, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --no-check-publish --quiet

      - name: Install project dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --quiet

      - name: Install Drupal test dependencies
        run: composer require --dev drupal/core-dev:^11.4 --with-all-dependencies --no-interaction --prefer-dist --no-progress --quiet

      - name: Check PHP syntax
        run: |
          php -l modules/custom/brebo_reference/brebo_reference.module
          php -l modules/custom/brebo_reference/brebo_reference.install
          php -l modules/custom/brebo_reference/src/Service/StableIdGenerator.php
          php -l modules/custom/brebo_reference/tests/src/Kernel/ReferenceRuntimeTest.php

      - name: Prepare SQLite test directory
        run: mkdir -p sites/default/files

      - name: Run Reference kernel test
        id: phpunit
        continue-on-error: true
        env:
          SIMPLETEST_DB: sqlite://localhost/sites/default/files/.ht.sqlite
          SIMPLETEST_BASE_URL: http://localhost
        run: |
          vendor/bin/phpunit -c core --colors=never modules/custom/brebo_reference/tests/src/Kernel/ReferenceRuntimeTest.php > phpunit.log 2>&1

      - name: Upload PHPUnit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brebo-reference-phpunit-log
          path: phpunit.log
          if-no-files-found: error
          retention-days: 7

      - name: Show PHPUnit result
        if: always()
        run: |
          if [ -f phpunit.log ]; then
            tail -n 80 phpunit.log
          fi
          test "${{ steps.phpunit.outcome }}" = "success"
