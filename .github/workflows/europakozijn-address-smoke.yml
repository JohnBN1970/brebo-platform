name: Europakozijn address smoke

on:
  push:
    branches:
      - develop
    paths:
      - 'modules/custom/brebo_europakozijn/**'
      - '.github/workflows/europakozijn-address-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  address-smoke:
    name: Verify PDOK and public address lookup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify PDOK BAG query
        shell: bash
        run: |
          set -euo pipefail
          body=/tmp/pdok-address.json
          code="$(curl -sS --get \
            --max-time 20 \
            -H 'Accept: application/geo+json, application/json' \
            -o "$body" \
            -w '%{http_code}' \
            --data-urlencode 'limit=25' \
            --data-urlencode 'f=json' \
            --data-urlencode "filter=postcode='6131BE' AND huisnummer=32" \
            --data-urlencode 'filter-lang=cql2-text' \
            'https://api.pdok.nl/kadaster/bag/ogc/v2/collections/adres/items')"

          echo "PDOK_HTTP_CODE=$code"
          if [[ "$code" != "200" ]]; then
            echo '--- PDOK response ---'
            cat "$body"
            echo
            echo "::error::Direct PDOK BAG address query failed."
            exit 1
          fi

          python3 - <<'PY'
          import json
          with open('/tmp/pdok-address.json', encoding='utf-8') as handle:
              payload = json.load(handle)
          features = payload.get('features') or []
          print(f'PDOK_FEATURE_COUNT={len(features)}')
          if not features:
              raise SystemExit('PDOK query returned no features')
          if not any((f.get('properties') or {}).get('postcode') == '6131BE' and int((f.get('properties') or {}).get('huisnummer') or 0) == 32 for f in features):
              raise SystemExit('PDOK response did not contain expected BAG address')
          PY

      - name: Verify BREBO public address endpoint
        shell: bash
        run: |
          set -euo pipefail
          body=/tmp/brebo-address.json
          code="$(curl -sS --get \
            --max-time 20 \
            -H 'Accept: application/json' \
            -o "$body" \
            -w '%{http_code}' \
            --data-urlencode 'postcode=6131BE' \
            --data-urlencode 'house_number=32A' \
            'https://brebobv.nl/europakozijn/api/address')"

          echo "BREBO_ADDRESS_HTTP_CODE=$code"
          if [[ "$code" != "200" ]]; then
            echo '--- BREBO address response ---'
            cat "$body"
            echo
            echo "::error::BREBO Europakozijn address lookup failed."
            exit 1
          fi

          python3 - <<'PY'
          import json
          with open('/tmp/brebo-address.json', encoding='utf-8') as handle:
              payload = json.load(handle)
          print('BREBO_ADDRESS_FOUND=' + ('1' if payload.get('found') is True else '0'))
          address = payload.get('address') or {}
          print('BREBO_ADDRESS_SOURCE=' + str(payload.get('source') or ''))
          if payload.get('found') is not True:
              raise SystemExit('BREBO address endpoint did not confirm address')
          if address.get('postal_code') != '6131BE':
              raise SystemExit('BREBO address endpoint returned unexpected postcode')
          PY
