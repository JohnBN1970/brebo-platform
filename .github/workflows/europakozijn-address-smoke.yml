name: Europakozijn address smoke

on:
  push:
    branches:
      - develop
    paths:
      - 'modules/custom/brebo_europakozijn/**'
      - '.github/workflows/europakozijn-address-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  address-smoke:
    name: Verify PDOK and public address lookup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify PDOK Locatieserver query
        shell: bash
        run: |
          set -euo pipefail
          body=/tmp/pdok-address.json
          code="$(curl -sS --get \
            --max-time 20 \
            -H 'Accept: application/json' \
            -o "$body" \
            -w '%{http_code}' \
            --data-urlencode 'q=6131BE 32A' \
            --data-urlencode 'fq=type:adres' \
            --data-urlencode 'rows=25' \
            'https://api.pdok.nl/bzk/locatieserver/search/v3_1/free')"

          echo "PDOK_HTTP_CODE=$code"
          if [[ "$code" != "200" ]]; then
            echo '--- PDOK response ---'
            cat "$body"
            echo
            echo "::error::Direct PDOK Locatieserver address query failed."
            exit 1
          fi

          python3 - <<'PY'
          import json
          with open('/tmp/pdok-address.json', encoding='utf-8') as handle:
              payload = json.load(handle)
          docs = ((payload.get('response') or {}).get('docs') or [])
          print(f'PDOK_ADDRESS_COUNT={len(docs)}')
          matches = [d for d in docs if (d.get('postcode') or '').replace(' ', '').upper() == '6131BE' and int(d.get('huisnummer') or 0) == 32 and (d.get('huisletter') or '').upper() == 'A']
          if not matches:
              raise SystemExit('PDOK Locatieserver did not contain expected BAG address')
          print('PDOK_ADDRESS_FOUND=1')
          PY

      - name: Verify BREBO public address endpoint
        shell: bash
        run: |
          set -euo pipefail
          body=/tmp/brebo-address.json
          code="$(curl -sS --get \
            --max-time 20 \
            -H 'Accept: application/json' \
            -o "$body" \
            -w '%{http_code}' \
            --data-urlencode 'postcode=6131BE' \
            --data-urlencode 'house_number=32A' \
            'https://brebobv.nl/europakozijn/api/address')"

          echo "BREBO_ADDRESS_HTTP_CODE=$code"
          if [[ "$code" != "200" ]]; then
            echo '--- BREBO address response ---'
            cat "$body"
            echo
            echo "::error::BREBO Europakozijn address lookup failed."
            exit 1
          fi

          python3 - <<'PY'
          import json
          with open('/tmp/brebo-address.json', encoding='utf-8') as handle:
              payload = json.load(handle)
          print('BREBO_ADDRESS_FOUND=' + ('1' if payload.get('found') is True else '0'))
          address = payload.get('address') or {}
          print('BREBO_ADDRESS_SOURCE=' + str(payload.get('source') or ''))
          if payload.get('found') is not True:
              raise SystemExit('BREBO address endpoint did not confirm address')
          if address.get('postal_code') != '6131BE' or address.get('house_number') != '32' or (address.get('house_letter') or '').upper() != 'A':
              raise SystemExit('BREBO address endpoint returned unexpected address')
          if not address.get('bag_nummeraanduiding_id') or not address.get('bag_adresseerbaar_object_id'):
              raise SystemExit('BREBO address endpoint did not preserve BAG identifiers')
          PY
